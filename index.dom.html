<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>soggyquarium</title>
    <style>
        body, html {
            height: 100%;
        }

        body {
            background-color: #777;
            color: white;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
        }

        sog-aquarium {
            display: block;
            overflow: hidden;
            background-color: rgb(63, 64, 96);
            background-image: linear-gradient(transparent 75%, rgb(101, 105, 90));
            width:  100%;
            height: 100%;

            position: relative;

            > * {
                position: absolute;
                top: 0;
                left: 0;
            }
        }

        img {
            transition: filter 0.64s, opacity 0.64s;
            will-change: transform;
            user-select: none;
            pointer-events: none;
            
            &:hover {
                filter:blur(5px);
                opacity: 0.5;
            }
        }

        debug-window {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 0em;
            
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 2em;
            box-sizing: border-box;

            /* filter:
                drop-shadow(0px 0px 20px black)
                drop-shadow(0px 0px 20px black); */

            span#amount-display {
                font-size: 6em;
                font-weight: 900;
            }

            span#fps-display {
                font-size: 2em;

                &::after { content: " fps" }
            }

            span#dt-display {
                font-size: 1.2em;

                &::after { content: " ms" }
            }

            span {
                text-shadow: 0 10px 40px black;
                line-height: 1.0;
                font-weight: 900;
            }

            input#amount {
                transform: scale(3);

                max-width: calc(24em / 3);
                width: calc(100% / 3);
                margin-top: 2em;
            }
        }
    </style>
</head>
<body>
    <sog-aquarium></sog-aquarium>
    <debug-window>
        <span id="fps-display">---</span>
        <span id="dt-display">---</span>
        <span id="amount-display">20</span>
        <input type="range" name="amount" id="amount" min="1" max="2560" value="20">
    </debug-window>

    <script>
        const rndFloat = (min, max) => Math.random() * (max - min) + min;

        class Creature
        {
            // I should probably put a params object instead of whatever that is
            constructor(iter, aquarium, element, size, scale, position, speed, direction, rotation, flipped)
            {
                this.iter      = iter;
                this.aquarium  = aquarium;
                this.scale     = scale     ?? rndFloat(0.5, 1.0);
                this.direction = direction ?? rndFloat(0.0, Math.PI * 2);
                this.rotation  = rotation  ?? rndFloat(0.0, 360.0);
                this.speed     = speed     ?? rndFloat(10.0, 50.0);
                this.flipped   = flipped   ?? Math.round(Math.random()) * 180;
                this.element   = aquarium.appendChild(
                    element.cloneNode(true)
                );
                this.size =
                {
                    w: this.element.clientWidth,
                    h: this.element.clientHeight
                };
                this.position = 
                {
                    x: position?.x ?? rndFloat(0.0, this.aquarium.clientWidth),
                    y: position?.y ?? rndFloat(0.0, this.aquarium.clientHeight)
                };
                this.origin = { x: 0.5, y: 0.5 };
                this.shown = true;
                this.matrix = new DOMMatrix();
            }

            updateBehaviour()
            {
                if (this.iter > this.aquarium.creatureLimit) return;

                const speed = this.aquarium.deltaTime * this.speed; 
                this.position.x += Math.sin(this.direction)  * speed;
                this.position.y += -Math.cos(this.direction) * speed;
                this.rotation += speed / 4;

                const overflow = Math.max(this.size.w, this.size.h) * this.scale;
                // const overflow = Math.max(111, 128) * this.scale;
                // const overflow = 0;

                // there has to be a better way to do the following

                this.isClipping =
                {
                    top:     this.position.y < -overflow,
                    bottom:  this.position.y > this.aquarium.clientHeight + overflow,
                    left:    this.position.x < -overflow,
                    right:   this.position.x > this.aquarium.clientWidth  + overflow,
                    overall: false
                }
                this.isClipping.overall = 
                    this.isClipping.top    ||
                    this.isClipping.bottom ||
                    this.isClipping.left   ||
                    this.isClipping.right;

                if (this.isClipping.top)    this.position.y = this.aquarium.clientHeight + overflow;
                if (this.isClipping.bottom) this.position.y = -overflow;
                if (this.isClipping.left)   this.position.x = this.aquarium.clientWidth + overflow;
                if (this.isClipping.right)  this.position.x = -overflow;
            }

            updateTransform()
            {
                switch (this.iter > this.aquarium.creatureLimit - 1) // making this a switch was probably useles
                {
                    case true:
                        if (this.shown)
                        {
                            this.shown = false;
                            this.element.style.visibility = "hidden";
                        }
                        return;
                    case false:
                        if (!this.shown)
                        {
                            this.shown = true;
                            this.element.style.visibility = "visible";
                        }
                }

                const position =
                {
                    x: this.position.x - this.origin.x * this.size.w,
                    y: this.position.y - this.origin.y * this.size.h,
                }

                if (this.element.attributeStyleMap)
                {
                    this.element.attributeStyleMap.set('transform', new CSSTransformValue([
                        new CSSTranslate(CSS.px(position.x), CSS.px(position.y), CSS.px(0)),
                        new CSSRotate(0, 1, 0, CSS.deg(this.flipped * 180)),
                        new CSSRotate(0, 0, 1, CSS.deg(this.rotation)),
                        new CSSScale(this.scale, this.scale)
                    ]));
                }
                else
                {
                    this.element.style.transform = `
                        translate3d(${position.x}px, ${position.y}px, 0)
                        rotateY(${this.flipped * 180}deg)
                        rotateZ(${this.rotation}deg)
                        scale(${this.scale})
                    `;
                }
            }
        }

                elementToClone.setAttribute("draggable", false);
                elementToClone.style.height = "128px";

                this.creatureLimit = 2560;
                this.creatures = [];

                for(let i = 0; i < this.creatureLimit; i++)
                {
                    this.creatures.push(
                        new Creature(
                            i,
                            this,
                            elementToClone,
                            null,
                            null,
                            null,
                            null,
                            null
                        )
                    );
                }

                this.prevTime  = 0;
                this.deltaTime = 0;
                this.frame     = 0;
                this.animate = currentTime =>
                {
                    if (this.frame == 5) this.creatureLimit = 20;
                    // I have to investigate why it fixes the lag on chromium doing it this way...
                    // probably some strange browser optimisation shenanigans.

                    currentTime ??= 0;
                    this.deltaTime = (currentTime - this.prevTime) / 1000;
                    this.prevTime  = currentTime;

                    for(let i = 0; i < this.creatures.length; i++)
                    {
                        this.creatures[i].updateBehaviour();
                        this.creatures[i].updateTransform();
                    }

                    document.getElementById("fps-display").innerText =
                        Math.round(1 / this.deltaTime);
                    document.getElementById("dt-display").innerText =
                        Math.round(this.deltaTime * 1000);

                    this.frame++;
                    requestAnimationFrame(this.animate);
                };

                window.onload = _ => this.animate();

                this.prevSize =
                {
                    w: this.clientWidth,
                    h: this.clientHeight,
                }

                // the soogs will be recentered on resize
                window.onresize = _ =>
                {
                    const sizeDiff =
                    {
                        w: (this.clientWidth  - this.prevSize.w) / 2,
                        h: (this.clientHeight - this.prevSize.h) / 2,
                    }

                    for(let i = 0; i < this.creatureLimit; i++) // we don't care about the invisible soogs
                    {
                        this.creatures[i].position.x += sizeDiff.w;
                        this.creatures[i].position.y += sizeDiff.h;
                    }

                    this.prevSize =
                    {
                        w: this.clientWidth,
                        h: this.clientHeight,
                    }
                }

                document.getElementById("amount").oninput = event =>
                {
                    const amount = Math.round(event.target.value);
                    this.creatureLimit = amount;
                    document.getElementById("amount-display").innerText = amount;
                }
            }

            disconnectedCallback() {
            }

            attributeChangedCallback(name, oldValue, newValue) {
                console.log(`Attribute ${name} has changed.`);
            }
        }

        customElements.define("sog-aquarium", SogAquariumElement);
    </script>
</body>
</html>
