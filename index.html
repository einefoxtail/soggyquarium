<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>soggyquarium</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');

        body, html {
            height: 100%;
        }

        body {
            background-color: #777;
            color: white;
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
        }

        #sog-aquarium {
            display: block;
            overflow: hidden;
            background-color: rgb(63, 64, 96);
            background-image: linear-gradient(transparent 75%, rgb(101, 105, 90));
            width:  100%;
            height: 100%;

            position: relative;

            > * {
                position: absolute;
                top: 0;
                left: 0;
            }
        }

        debug-window {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 0em;
            
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 2em;
            box-sizing: border-box;

            /* filter:
                drop-shadow(0px 0px 20px black)
                drop-shadow(0px 0px 20px black); */

            span#amount-display {
                font-size: 6em;
                font-weight: 900;
            }

            span#fps-display {
                font-size: 2em;

                &::after { content: " fps" }
            }

            span#dt-display {
                font-size: 1.2em;

                &::after { content: " ms" }
            }

            span {
                text-shadow: 0 10px 40px black;
                line-height: 1.0;
                font-weight: 900;
            }

            input#amount {
                transform: scale(3);

                max-width: calc(24em / 3);
                width: calc(100% / 3);
                margin-top: 2em;
            }
        }
    </style>

</head>
<body>
    <canvas is="sog-aquarium" id="sog-aquarium"></canvas>
    <debug-window>
        <span id="fps-display">---</span>
        <span id="dt-display">---</span>
        <span id="amount-display">---</span>
        <input type="range" name="amount" id="amount">
    </debug-window>
</body>
<script>
    const rndFloat = (min, max) => Math.random() * (max - min) + min;
    const clamp    = (min, x, max) => Math.min(Math.max(x, min), max);
    const easeOut  = (x) => 1 - Math.pow(1 - x, 4);
    const easeIn   = (x) => Math.pow(x, 4);

    class Creature
    {
        // I should probably put a params object instead of whatever that is
        constructor(iter, aquarium, img, params)
        {
            this.iter      = iter;
            this.opacity   = 0;
            this.aquarium  = aquarium;
            this.scale     = params?.scale     ?? rndFloat(0.4, 2.2);
            this.direction = params?.direction ?? rndFloat(0.0, Math.PI * 2);
            this.rotation  = params?.rotation  ?? rndFloat(0.0, Math.PI * 2);
            this.speed     = params?.speed     ?? rndFloat(10.0, 50.0);
            this.flipped   = params?.flipped   ?? Math.round(Math.random()) * 180;
            this.img   = aquarium.appendChild(
                img.cloneNode(true)
            );
            this.size =
            {
                w: params?.size?.w ?? img.width,
                h: params?.size?.h ?? img.height
            };
            this.position = 
            {
                x: params?.position?.x ?? rndFloat(0.0, this.aquarium.clientWidth),
                y: params?.position?.y ?? rndFloat(0.0, this.aquarium.clientHeight)
            };
            this.origin = { x: 0.5, y: 0.5 };
            this.shown = true;
            this.matrix = new DOMMatrix();
        }

        updateBehaviour()
        {
            if (this.opacity <= 0 && this.iter > this.aquarium.creatureLimit - 1) return;

            const speed = this.aquarium.deltaTime * this.speed; 
            this.position.x += Math.sin(this.direction)  * speed;
            this.position.y += -Math.cos(this.direction) * speed;
            this.rotation += speed / 80;
            this.rotation %= Math.PI * 2;

            const overflow = Math.max(this.size.w, this.size.h) * this.scale;

            // there has to be a better way to do the following:

            this.isClipping =
            {
                top:     this.position.y < -overflow,
                bottom:  this.position.y > this.aquarium.clientHeight + overflow,
                left:    this.position.x < -overflow,
                right:   this.position.x > this.aquarium.clientWidth  + overflow,
                overall: false
            }
            this.isClipping.overall = 
                this.isClipping.top    ||
                this.isClipping.bottom ||
                this.isClipping.left   ||
                this.isClipping.right;

            if (this.isClipping.top)    this.position.y = this.aquarium.clientHeight + overflow;
            if (this.isClipping.bottom) this.position.y = -overflow;
            if (this.isClipping.left)   this.position.x = this.aquarium.clientWidth + overflow;
            if (this.isClipping.right)  this.position.x = -overflow;
        }

        draw()
        {
            const hidden = (this.iter > this.aquarium.creatureLimit - 1);
            if (hidden && this.opacity <= 0.0) return;
            this.opacity += this.aquarium.deltaTime * (hidden ? -1 : 1) * (this.speed / hidden ? 4 : 16);
            this.opacity = clamp(0.0, this.opacity, 1.0);

            const prevAlpha = this.aquarium.ctx.globalAlpha;

            const easedOpacity = hidden ? easeIn(this.opacity) : easeOut(this.opacity);

            this.aquarium.ctx.globalAlpha = easedOpacity;

            const size =
            {
                w: this.scale * this.size.w * easedOpacity,
                h: this.scale * this.size.h * easedOpacity,
            };

            // this.aquarium.ctx.fillRect(this.position.x, this.position.y, 40, 60);
            const cos = Math.cos(this.rotation);
            const sin = Math.sin(this.rotation);

            this.aquarium.ctx.setTransform(cos, sin, -sin, cos, this.position.x, this.position.y);

            this.aquarium.ctx.drawImage(
                this.img,
                -size.w * this.origin.x,
                -size.h * this.origin.y,
                size.w,
                size.h
            );

            this.aquarium.ctx.resetTransform();
            this.aquarium.ctx.globalAlpha = prevAlpha;
        }
    }

    class SogAquariumElement extends HTMLCanvasElement
    {
        constructor()
        {
            super();
        }

        connectedCallback()
        {
            let soggyCatImg = document.createElement("img");
            soggyCatImg.src = "soggymarker.png";

            this.width  = this.clientWidth  * devicePixelRatio;
            this.height = this.clientHeight * devicePixelRatio;
            this.ctx = this.getContext("2d");
            this.creatures = [];
            this.prevTime  = 0;
            this.deltaTime = 0;
            this.frame     = 0;
            this.prevSize  =
            {
                w: this.clientWidth,
                h: this.clientHeight,
            };
            this.creatureMaxAmount = 5120;
            this.creatureLimit = 20;
            document.getElementById("amount").min   = 1;
            document.getElementById("amount").max   = this.creatureMaxAmount;
            document.getElementById("amount").value = this.creatureLimit;
            document.getElementById("amount-display").innerText = this.creatureLimit;

            for(let iter = 0; iter < this.creatureMaxAmount; iter++)
            {
                this.creatures.push(
                    new Creature(
                        iter,
                        this,
                        soggyCatImg,
                        {
                            size: {
                                w: 111,
                                h: 128,
                            }
                        },
                    )
                );
            }

            this.animate = currentTime =>
            {
                currentTime ??= 0;
                this.deltaTime = (currentTime - this.prevTime) / 1000;
                this.prevTime  = currentTime;

                this.ctx.clearRect(0, 0, this.width, this.height); // implement clear zones

                for(let i = 0; i < this.creatureMaxAmount; i++) // we don't care anymore about the invisible soogs
                {
                    this.creatures[i].updateBehaviour();
                    this.creatures[i].draw();
                }

                document.getElementById("fps-display").innerText =
                    Math.round(1 / this.deltaTime);
                document.getElementById("dt-display").innerText =
                    Math.round(this.deltaTime * 1000);

                this.frame++;
                requestAnimationFrame(this.animate);
            };

            window.addEventListener("load", _ => this.animate());

            // the soogs will be recentered on resize
            window.addEventListener("resize", _ =>
            {
                this.width  = this.clientWidth  * devicePixelRatio;
                this.height = this.clientHeight * devicePixelRatio;

                const sizeDiff =
                {
                    w: (this.width  - this.prevSize.w) / 2,
                    h: (this.height - this.prevSize.h) / 2,
                }

                for(let i = 0; i < this.creatureMaxAmount; i++)
                {
                    this.creatures[i].position.x += sizeDiff.w;
                    this.creatures[i].position.y += sizeDiff.h;
                }

                this.prevSize =
                {
                    w: this.width,
                    h: this.height,
                }
            });
        }

        disconnectedCallback()
        {
            // lazy, bleeeh
        }

        attributeChangedCallback(name, oldValue, newValue)
        {
            console.log(`Attribute ${name} has changed.`);
        }
    }

    customElements.define("sog-aquarium", SogAquariumElement, { extends: "canvas" });

    document.getElementById("amount").addEventListener("input", event =>
    {
        const amount = Math.round(event.target.value);
        document.getElementById("sog-aquarium").creatureLimit = amount;
        document.getElementById("amount-display").innerText = amount;
    });
</script>
</html>
