<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>soggyquarium</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');

        body, html {
            height: 100%;
        }

        body {
            background-color: #777;
            color: white;
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
        }

        #sog-aquarium {
            display: block;
            overflow: hidden;
            background-color: rgb(63, 64, 96);
            background-image: linear-gradient(transparent 75%, rgb(101, 105, 90));
            width:  100%;
            height: 100%;

            position: relative;

            > * {
                position: absolute;
                top: 0;
                left: 0;
            }
        }

        debug-window {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 0em;
            
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 1.5em;
            box-sizing: border-box;

            /* filter:
                drop-shadow(0px 0px 20px black)
                drop-shadow(0px 0px 20px black); */

            span#amount-display {
                font-size: 6em;
                font-weight: 900;
            }

            span#fps-display {
                font-size: 2em;

                &::after { content: " fps" }
            }

            span#dt-display {
                font-size: 1.2em;

                &::after { content: " ms" }
            }

            span {
                text-shadow: 0 10px 40px black;
                line-height: 1.0;
                font-weight: 900;
            }

            input#amount {
                transform: scale(3);

                max-width: calc(32em / 3);
                width: calc(100% / 3);
                margin: 2em 0;
            }
        }
    </style>

</head>
<body>
    <sog-aquarium id="sog-aquarium"></sog-aquarium>
    <debug-window>
        <span id="fps-display">---</span>
        <span id="dt-display">---</span>
        <span id="amount-display">---</span>
        <input type="range" name="amount" id="amount">
    </debug-window>
</body>
<script>
    const rndFloat = (min, max) => Math.random() * (max - min) + min;
    const clamp    = (min, x, max) => Math.min(Math.max(x, min), max);
    const easeOut  = (x) => 1 - Math.pow(1 - x, 4);
    const easeIn   = (x) => Math.pow(x, 4);
    const distance = (pos1, pos2) => Math.sqrt(Math.pow(pos1.x - pos2.x, 2) + Math.pow(pos1.y - pos2.y, 2))

    class Creature
    {
        constructor(iter, aquarium, sprite, params)
        {
            this.iter           = iter;
            this.opacity        = 0;
            this.aquarium       = aquarium;
            this.scale          = params?.scale         ?? rndFloat(1.3, 1.8);
            this.direction      = params?.direction     ?? rndFloat(0.0, Math.PI * 2);
            this.speed          = params?.speed         ?? rndFloat(5.0, 80.0);
            this.flipped        = params?.flipped       ?? Math.round(Math.random());
            this.rotation       = params?.rotation      ?? rndFloat(0.0, Math.PI * 2);
            this.img = sprite;
            this.size =
            {
                w: params?.size?.w ?? sprite.width,
                h: params?.size?.h ?? sprite.height
            };
            this.position = 
            {
                x: params?.position?.x ?? rndFloat(0.0, this.aquarium.size.w),
                y: params?.position?.y ?? rndFloat(0.0, this.aquarium.size.h)
            };
            this.origin = { x: 0.5, y: 0.5 };
            this.shown = true;
            this.matrix = new DOMMatrix();
            this.hadCollision = false;
        }

        updateBehaviour()
        {
            if (this.opacity <= 0 && this.iter > this.aquarium.creatureLimit - 1) return;

            const speed = this.aquarium.deltaTime * this.speed * this.aquarium.speed;
            this.position.x += Math.sin(this.direction)  * speed;
            this.position.y += -Math.cos(this.direction) * speed;
            this.rotation += (this.flipped ? -speed : speed) / 80;
            this.rotation %= Math.PI * 2;

            const overflow = Math.max(this.size.w, this.size.h) * this.scale;

            // there has to be a better way to do the following:

            this.isClipping =
            {
                top:     this.position.y < -overflow,
                bottom:  this.position.y > this.aquarium.size.h + overflow,
                left:    this.position.x < -overflow,
                right:   this.position.x > this.aquarium.size.w  + overflow,
                overall: false
            }
            this.isClipping.overall = 
                this.isClipping.top    ||
                this.isClipping.bottom ||
                this.isClipping.left   ||
                this.isClipping.right;

            if (this.isClipping.top)    this.position.y = this.aquarium.size.h + overflow;
            if (this.isClipping.bottom) this.position.y = -overflow;
            if (this.isClipping.left)   this.position.x = this.aquarium.size.w + overflow;
            if (this.isClipping.right)  this.position.x = -overflow;

            if (this.aquarium.collisions) for(let i = 0; i < this.aquarium.creatureLimit; i++)
            {
                const creature = this.aquarium.creatures[i];
                if (creature.iter == this.iter) return;
                if (distance(this.position, creature.position) < 128)
                {
                    if (!this.hadCollision)     this.direction += Math.PI;
                    if (!creature.hadCollision) creature.direction += Math.PI;
                    this.hadCollision = true;
                    creature.hadCollision = true;
                }
                else this.hadCollision = false;
            }
        }

        draw()
        {
            const hidden = (this.iter > this.aquarium.creatureLimit - 1);
            if (hidden && this.opacity <= 0.0) return;
            this.opacity += this.aquarium.deltaTime * (hidden ? -1 : 1) * (this.speed / (hidden ? 8 : 16));
            this.opacity = clamp(0.0, this.opacity, 1.0);

            const prevAlpha = this.aquarium.ctx.globalAlpha;

            const size =
            {
                w: this.size.w * this.scale * devicePixelRatio,
                h: this.size.h * this.scale * devicePixelRatio,
            };

            let opacity = this.opacity;
            
            if (opacity < 1.0)
            {
                opacity = hidden ? easeOut(opacity) : easeOut(opacity);
                size.w += (1 - opacity) * (size.w / 3);
                size.h += (1 - opacity) * (size.h / 3);
                this.aquarium.ctx.globalAlpha = opacity;
            }

            // this.aquarium.ctx.fillRect(
            //     Math.floor(this.position.x / this.aquarium.size.w * 50) * this.aquarium.size.w / 50,
            //     this.position.y,
            //     60,
            //     60
            // );

            const cos = Math.cos(this.rotation);
            const sin = Math.sin(this.rotation);

            this.aquarium.ctx.setTransform(
                cos,
                sin,
                -sin,
                cos,
                this.position.x * devicePixelRatio,
                this.position.y * devicePixelRatio);

            this.aquarium.ctx.drawImage(
                this.img,
                -size.w * this.origin.x,
                -size.h * this.origin.y,
                size.w,
                size.h
            );

            this.aquarium.ctx.resetTransform();
            this.aquarium.ctx.globalAlpha = prevAlpha;
        }
    }

    class SogAquariumElement extends HTMLElement
    {
        #size = { w:0, h:0 };
        get size()
        {
            return this.#size;
        }
        set size(x)
        {
            this.#size = 
            {
                w: x.w,
                h: x.h,
            };
            this.canvas.width  = this.#size.w * devicePixelRatio;
            this.canvas.height = this.#size.h * devicePixelRatio;
        }

        constructor()
        {
            super();
        }

        connectedCallback()
        {
            this.canvas = 
            this.appendChild(document.createElement("canvas"));
            this.canvas.style.width  = "100%";
            this.canvas.style.height = "100%";
            this.ctx = this.canvas.getContext("2d");
            this.ctx.fillStyle = "red";
            
            this.size =
            {
                w: this.clientWidth,
                h: this.clientHeight
            };
            this.prevSize = this.size;
            this.prevDevicePixelRatio = devicePixelRatio;

            this.creatureSprite = document.createElement("img");
            this.creatureSprite.src = "soggymarker.png";

            this.collisions = false;
            this.creatures = [];
            this.prevTime  = 0;
            this.deltaTime = 0;
            this.frame     = 0;
            this.speed     = 1.0;

            this.creatureMaxAmount = 4096;
            this.creatureLimit = 20;
            document.getElementById("amount").min   = 0;
            document.getElementById("amount").max   = 1;
            document.getElementById("amount").step  = 1e-32;
            document.getElementById("amount").value = 
                Math.pow(this.creatureLimit / this.creatureMaxAmount, 1 / 4);
            document.getElementById("amount-display").innerText = this.creatureLimit;

            for(let iter = 0; iter < this.creatureMaxAmount; iter++)
            {
                this.creatures.push(
                    new Creature(
                        iter,
                        this,
                        this.creatureSprite,
                        {
                            size:
                            {
                                w: 111,
                                h: 128,
                            }
                        },
                    )
                );
            }

            this.draw = currentTime =>
            {
                if (this.prevDevicePixelRatio != devicePixelRatio) this.resize();
                this.prevDevicePixelRatio = devicePixelRatio;

                currentTime ??= 0;
                this.deltaTime = (currentTime - this.prevTime) / 1000;
                this.prevTime  = currentTime;

                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height); // todo?: implement some sort of clear zones (but is it necessary here...?)

                for(let i = 0; i < this.creatureMaxAmount; i++) // we care about the invisible soogs
                {
                    this.creatures[i].updateBehaviour();
                    this.creatures[i].draw();
                }

                document.getElementById("fps-display").innerText =
                    Math.round(1 / this.deltaTime);
                document.getElementById("dt-display").innerText =
                    Math.round(this.deltaTime * 1000);

                this.frame++;
                requestAnimationFrame(this.draw);
            };

            document.getElementById("amount").addEventListener("input", event =>
            {
                let askedLimit = Math.pow(event.target.value, 4);
                askedLimit *= this.creatureMaxAmount;
                askedLimit = Math.round(askedLimit);
                if (askedLimit == 0) askedLimit = 1; // ugly, but it works.

                this.creatureLimit = askedLimit;
                document.getElementById("amount-display").innerText = askedLimit;
            });

            window.addEventListener("load",   _ => this.draw());
            window.addEventListener("resize", _ => this.resize());
            this.addEventListener("click",    _ => this.disrupt());
        }

        disrupt()
        {
            for(let i = 0; i < this.creatureLimit; i++)
            {
                this.creatures[i].direction  += rndFloat(-90.0, 90.0);
                this.creatures[i].speed =
                    clamp(5.0, this.creatures[i].speed + rndFloat(-25.0, 20.0), 80.0);
            }
        }

        resize()
        {
            this.prevSize = this.size;
            this.size =
            {
                w: this.clientWidth,
                h: this.clientHeight
            };

            const sizeDiff =
            {
                w: (this.size.w - this.prevSize.w) / 2,
                h: (this.size.h - this.prevSize.h) / 2,
            }

            for(let i = 0; i < this.creatureMaxAmount; i++)
            {
                this.creatures[i].position.x += sizeDiff.w;
                this.creatures[i].position.y += sizeDiff.h;
            }

            console.debug(`Resize event (${this.size.w}x${this.size.h}x${devicePixelRatio})`);
        }

        disconnectedCallback()
        {
            // lazy, bleeeh
        }

        attributeChangedCallback(name, oldValue, newValue)
        {
            console.log(`Attribute ${name} has changed.`);
        }
    }

    customElements.define("sog-aquarium", SogAquariumElement);
</script>
</html>
